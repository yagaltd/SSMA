[package]
name = "ssma-rust"
version = "0.1.0"
edition = "2021"
description = "SSMA Rust scaffold for protocol parity"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-stream = "0.3"
axum = { version = "0.7", features = ["ws", "multipart"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hound = "3"
jsonwebtoken = "9"
jsonschema = "0.18"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
oauth2 = { version = "4.4", default-features = false, features = ["reqwest", "rustls-tls"] }
rustrtc = "0.3.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "compression-gzip", "compression-br", "trace"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
voxudio = { version = "0.5.8", features = ["opus"] }

[dev-dependencies]
tempfile = "3"
http = "1"
